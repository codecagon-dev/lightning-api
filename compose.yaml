services:
  api:
    build: .
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_PATH: /app/data/lightning.sqlite
    volumes:
      - ./data:/app/data
